# Storybook 문서를 GitHub Pages로 올린다.
#
# 이 꾸러미는 화면이 없고 문서가 얼굴이다. 부품이 어떻게 생겼고 언제 쓰는지는
# Storybook에만 적혀 있어서, 그게 떠 있지 않으면 아무도 확인할 수 없다.
#
# 처음 한 번 해줄 일 — 레포 Settings > Pages에서 Source를 "GitHub Actions"로
# 바꾼다. 기본값인 "Deploy from a branch"로 두면 이 워크플로가 돌아도
# 반영되지 않는다.
#
# 자산 경로가 모두 상대경로라 ranixxd.github.io/maker-design-system/ 같은
# 서브경로에 그대로 올라간다. base 설정이 따로 필요 없다.

name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build-storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
